# The native consumer app. It has no React Native Gradle Plugin, no node_modules and no
# autolinking — it only knows com.pbb:brownfieldlib, which is what makes it a brownfield app.

org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 ships its own Kotlin and a new DSL. The React Native Gradle Plugin in ../android
# opts out of both; the AAR that project publishes carries kotlin-stdlib 2.4.21, so the
# app has to stay on the same compiler line to read it.
android.builtInKotlin=false
android.newDsl=false

# The fat AAR ships arm64 .so files only (see reactNativeArchitectures in ../android).
reactNativeArchitectures=arm64-v8a

kotlin.incremental=false
