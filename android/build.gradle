buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        // 36 is the level where Android enforces the predictive back gesture and stops
        // calling Activity.onBackPressed(). Both the ReactActivity work in ../react-native
        // and the native app's expectations key off this number.
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // From ../react-native-brownfield/gradle-plugins/react/brownfield, published by
        // `yarn brownfield-plugin:publish` (scripts/publish-brownfield-plugin.sh).
        classpath("com.callstack.react:brownfield-gradle-plugin:2.0.0-alpha10-SNAPSHOT")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // com.facebook.react:react-android:1000.0.0 is the ../react-native checkout, published
        // here by scripts/publish-rn.sh. The brownfield plugin needs a real AAR on disk, since
        // it unzips and merges AARs — a composite build (includeBuild) has nothing to explode.
        maven { url = uri("/tmp/maven-local") }
        mavenLocal()
    }
}

apply plugin: "com.facebook.react.rootproject"
