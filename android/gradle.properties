# Project-wide Gradle settings.

# Building react-android from ../react-native inside the fat AAR needs more heap
# than a normal app build.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true

# The emulator and device images used here are arm64.
reactNativeArchitectures=arm64-v8a
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

# Opt out of built-in kotlin and the new DSL that ship with AGP 9.
android.builtInKotlin=false
android.newDsl=false

# Kotlin's incremental compilation breaks for libraries reached through a symlink
# (react-native-brownfield is node_modules/@callstack/react-native-brownfield ->
# ../../react-native-brownfield/packages/react-native-brownfield). IC resolves the
# sources under the canonical path while previous outputs were recorded under the
# symlinked one, then treats the module's own classes as an external binary
# dependency and every `internal` becomes unreadable. Full rebuilds cost seconds.
kotlin.incremental=false
